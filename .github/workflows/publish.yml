name: Publish to npm

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        environment: npm

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.18.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Run tests
              run: pnpm test:run

            - name: Build
              run: pnpm build

            - name: Publish
              run: npm publish --access public
